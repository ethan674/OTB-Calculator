services:
  app:
    build: .
    restart: unless-stopped
    environment:
      DATABASE_URL: "file:/app/data/prod.db"
      TEAM_PASSWORD: ${TEAM_PASSWORD}
      SESSION_SECRET: ${SESSION_SECRET}
      NODE_ENV: production
      RUN_SEED_ON_START: ${RUN_SEED_ON_START:-false}
    volumes:
      - otb_data:/app/data
    expose:
      - "3000"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

volumes:
  otb_data:
  caddy_data:
  caddy_config:
